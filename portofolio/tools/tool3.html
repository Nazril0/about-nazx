<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pemilih Warna</title>
<link rel="stylesheet" href="ios.css">
<style>
  .swatch{height:180px;border-radius:26px;position:relative;box-shadow:0 16px 36px rgba(0,0,0,.14),inset 0 0 0 .5px rgba(0,0,0,.08);transition:background .12s;overflow:hidden}
  .swatch label{position:absolute;right:12px;bottom:12px;height:38px;padding:0 14px;border-radius:999px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:600;cursor:pointer;
    background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(18px) saturate(180%);backdrop-filter:blur(18px) saturate(180%);color:#000}
  .swatch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
  .swatch label input{display:none}
  .swatch .hexbig{position:absolute;left:18px;top:14px;font-size:22px;font-weight:700;letter-spacing:.02em;font-family:var(--mono);mix-blend-mode:normal}
  .sl{padding:10px 16px 6px}
  .sl .row{display:flex;justify-content:space-between;font-size:15px;margin-bottom:-2px}
  .sl .row span:last-child{color:var(--label2);font-variant-numeric:tabular-nums}
  #h{--track:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
  .sl input[type=range]::-webkit-slider-runnable-track{background:var(--track)}
  .sl input[type=range]::-moz-range-track{background:var(--track)}
  .sl input[type=range]::-moz-range-progress{background:transparent}
  .sl input[type=range]::-webkit-slider-thumb{box-shadow:0 0 0 2px #fff,0 3px 8px rgba(0,0,0,.28)}
  .sl input[type=range]::-webkit-slider-runnable-track{height:10px;border-radius:10px}
  .sl input[type=range]::-moz-range-track{height:10px;border-radius:10px}
  .sl input[type=range]::-webkit-slider-thumb{margin-top:-9px}
  .copy{width:100%;text-align:left}
  .copy .val{font-family:var(--mono);font-size:16px;color:var(--label)}
  .copy .tag{width:44px;font-size:13px;font-weight:600;color:var(--label2)}
  .copy:active{background:var(--fill)}
  .dots{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:16px}
  .dots button{aspect-ratio:1;border-radius:50%;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.12);transition:transform .25s var(--spring)}
  .dots button:active{transform:scale(.88)}
</style>
</head>
<body>
<div class="app">
  <h1 class="title">Pemilih Warna</h1>

  <div class="swatch" id="sw">
    <span class="hexbig" id="big">#007AFF</span>
    <label><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 4l6 6-9 9H5v-6z"/><path d="M12 6l6 6"/></svg>Pilih<input type="color" id="native" aria-label="Pilih warna dari sistem"></label>
  </div>

  <div class="hdr">Atur</div>
  <div class="group">
    <div class="sl"><div class="row"><span>Rona</span><span id="vh">211°</span></div><input type="range" id="h" min="0" max="360" aria-label="Rona"></div>
    <div class="sl"><div class="row"><span>Kejenuhan</span><span id="vs">100%</span></div><input type="range" id="s" min="0" max="100" aria-label="Kejenuhan"></div>
    <div class="sl"><div class="row"><span>Kecerahan</span><span id="vl">50%</span></div><input type="range" id="l" min="0" max="100" aria-label="Kecerahan"></div>
  </div>

  <div class="hdr">Nilai · ketuk untuk menyalin</div>
  <div class="group">
    <button class="cell copy" type="button" data-k="hex"><span class="tag">HEX</span><span class="val grow" id="oHex"></span></button>
    <button class="cell copy" type="button" data-k="rgb"><span class="tag">RGB</span><span class="val grow" id="oRgb"></span></button>
    <button class="cell copy" type="button" data-k="hsl"><span class="tag">HSL</span><span class="val grow" id="oHsl"></span></button>
  </div>

  <div class="hdr">Warna sistem iOS</div>
  <div class="group"><div class="dots" id="dots"></div></div>
  <div class="btn-row" style="margin-top:16px"><button class="btn tint" type="button" id="rand">Acak warna</button></div>
</div>
<script src="ios.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  let H = 211, S = 100, L = 50;
  const hsl2rgb = (h, s, l) => {
    s /= 100; l /= 100;
    const k = (n) => (n + h / 30) % 12, a = s * Math.min(l, 1 - l);
    const f = (n) => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
    return [Math.round(f(0) * 255), Math.round(f(8) * 255), Math.round(f(4) * 255)];
  };
  const rgb2hsl = (r, g, b) => {
    r /= 255; g /= 255; b /= 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn; let h = 0, s = 0; const l = (mx + mn) / 2;
    if (d) {
      s = d / (1 - Math.abs(2 * l - 1));
      h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60; if (h < 0) h += 360;
    }
    return [Math.round(h), Math.round(s * 100), Math.round(l * 100)];
  };
  const hex = (rgb) => '#' + rgb.map((v) => v.toString(16).padStart(2, '0')).join('').toUpperCase();
  let out = {};

  const render = () => {
    const rgb = hsl2rgb(H, S, L);
    out = { hex: hex(rgb), rgb: `rgb(${rgb.join(', ')})`, hsl: `hsl(${H}, ${S}%, ${L}%)` };
    $('sw').style.background = out.hex;
    $('big').textContent = out.hex;
    const lum = (0.299 * rgb[0] + 0.587 * rgb[1] + 0.114 * rgb[2]) / 255;
    $('big').style.color = lum > 0.62 ? 'rgba(0,0,0,.75)' : '#fff';
    $('oHex').textContent = out.hex; $('oRgb').textContent = out.rgb; $('oHsl').textContent = out.hsl;
    $('vh').textContent = H + '°'; $('vs').textContent = S + '%'; $('vl').textContent = L + '%';
    $('h').value = H; $('s').value = S; $('l').value = L; $('native').value = out.hex.toLowerCase();
    $('s').style.setProperty('--track', `linear-gradient(90deg,hsl(${H} 0% ${L}%),hsl(${H} 100% ${L}%))`);
    $('l').style.setProperty('--track', `linear-gradient(90deg,#000,hsl(${H} ${S}% 50%),#fff)`);
  };
  const setHex = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(h); if (!m) return;
    const n = parseInt(m[1], 16); [H, S, L] = rgb2hsl(n >> 16, (n >> 8) & 255, n & 255); render();
  };
  ['h', 's', 'l'].forEach((id) => $(id).addEventListener('input', () => { H = +$('h').value; S = +$('s').value; L = +$('l').value; render(); }));
  $('native').addEventListener('input', (e) => setHex(e.target.value));
  document.querySelectorAll('.copy').forEach((b) => b.addEventListener('click', () => iOS.copy(out[b.dataset.k], `${b.dataset.k.toUpperCase()} tersalin ✓`)));
  $('rand').onclick = () => { H = Math.floor(Math.random() * 361); S = 55 + Math.floor(Math.random() * 45); L = 35 + Math.floor(Math.random() * 35); render(); iOS.buzz(); };

  const sys = ['#FF3B30', '#FF9500', '#FFCC00', '#34C759', '#00C7BE', '#30B0C7', '#32ADE6', '#007AFF', '#5856D6', '#AF52DE', '#FF2D55', '#A2845E'];
  sys.forEach((c) => {
    const b = document.createElement('button'); b.type = 'button'; b.style.background = c; b.setAttribute('aria-label', 'Warna ' + c);
    b.onclick = () => { setHex(c); iOS.buzz(); }; $('dots').appendChild(b);
  });
  setHex('#007AFF');
})();
</script>
</body>
</html>
