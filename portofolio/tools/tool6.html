<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Generator Password</title>
<link rel="stylesheet" href="ios.css">
<style>
  .pw{background:var(--cell);border-radius:22px;padding:22px 18px 16px}
  #pw{font-family:var(--mono);font-size:26px;line-height:1.45;word-break:break-all;letter-spacing:.02em;min-height:76px;font-weight:500}
  #pw .d{color:var(--blue)}#pw .s{color:var(--orange)}#pw .u{color:var(--label)}
  .meter{display:flex;gap:5px;margin-top:14px}
  .meter i{flex:1;height:5px;border-radius:5px;background:var(--fill2);transition:background .3s}
  .strength{display:flex;justify-content:space-between;font-size:13px;color:var(--label2);margin-top:8px}
  .strength b{font-weight:600}
  .len{padding:12px 16px 8px}
  .len .row{display:flex;justify-content:space-between;align-items:baseline}
  .len .row b{font-size:22px;font-variant-numeric:tabular-nums}
  .icon{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;color:#fff;font-size:13px;font-weight:700;flex:none}
</style>
</head>
<body>
<div class="app">
  <h1 class="title">Generator Password<small>Dibuat di perangkatmu, tidak dikirim ke mana pun.</small></h1>

  <div class="pw">
    <div id="pw" aria-live="polite"></div>
    <div class="meter" id="meter"><i></i><i></i><i></i><i></i></div>
    <div class="strength"><span id="sLbl"></span><span id="sBits"></span></div>
  </div>

  <div class="btn-row" style="margin-top:12px">
    <button class="btn gray" type="button" id="gen">Buat ulang</button>
    <button class="btn" type="button" id="cp">Salin</button>
  </div>

  <div class="hdr">Panjang</div>
  <div class="group"><div class="len"><div class="row"><span>Karakter</span><b id="lenV">16</b></div><input type="range" id="len" min="6" max="40" value="16" aria-label="Panjang password"></div></div>

  <div class="hdr">Isi</div>
  <div class="group">
    <label class="cell"><span class="icon" style="background:#5856D6">Aa</span><span class="lbl grow">Huruf besar</span><span class="switch"><input type="checkbox" data-set="up" checked><i></i></span></label>
    <label class="cell"><span class="icon" style="background:#007AFF">aa</span><span class="lbl grow">Huruf kecil</span><span class="switch"><input type="checkbox" data-set="lo" checked><i></i></span></label>
    <label class="cell"><span class="icon" style="background:#34C759">12</span><span class="lbl grow">Angka</span><span class="switch"><input type="checkbox" data-set="di" checked><i></i></span></label>
    <label class="cell"><span class="icon" style="background:#FF9500">#!</span><span class="lbl grow">Simbol</span><span class="switch"><input type="checkbox" data-set="sy"><i></i></span></label>
  </div>
  <p class="ftr">Minimal satu jenis karakter harus aktif.</p>
</div>
<script src="ios.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SETS = { up: 'ABCDEFGHJKLMNPQRSTUVWXYZ', lo: 'abcdefghijkmnopqrstuvwxyz', di: '23456789', sy: '!@#$%^&*-_+=?' };
  const rnd = (n) => { const lim = Math.floor(0x100000000 / n) * n; const a = new Uint32Array(1); do crypto.getRandomValues(a); while (a[0] >= lim); return a[0] % n; };
  let pw = '';

  const active = () => [...document.querySelectorAll('[data-set]')].filter((c) => c.checked).map((c) => SETS[c.dataset.set]);
  const gen = () => {
    const sets = active(), len = +$('len').value, pool = sets.join('');
    const chars = sets.map((s) => s[rnd(s.length)]);
    while (chars.length < len) chars.push(pool[rnd(pool.length)]);
    for (let i = chars.length - 1; i > 0; i--) { const j = rnd(i + 1); [chars[i], chars[j]] = [chars[j], chars[i]]; }
    pw = chars.slice(0, len).join('');
    const box = $('pw'); box.innerHTML = '';
    for (const ch of pw) { const s = document.createElement('span'); s.className = /\d/.test(ch) ? 'd' : /[a-zA-Z]/.test(ch) ? 'u' : 's'; s.textContent = ch; box.appendChild(s); }
    const bits = Math.round(len * Math.log2(pool.length));
    const lv = bits < 40 ? 0 : bits < 60 ? 1 : bits < 85 ? 2 : 3;
    const names = ['Lemah', 'Cukup', 'Kuat', 'Sangat kuat'], cols = ['#FF3B30', '#FF9500', '#34C759', '#30B0C7'];
    document.querySelectorAll('#meter i').forEach((el, i) => { el.style.background = i <= lv ? cols[lv] : ''; });
    $('sLbl').innerHTML = `<b style="color:${cols[lv]}">${names[lv]}</b>`; $('sBits').textContent = `${bits} bit`;
  };
  $('len').addEventListener('input', () => { $('lenV').textContent = $('len').value; iOS.fillRange($('len')); gen(); });
  document.querySelectorAll('[data-set]').forEach((c) => c.addEventListener('change', () => {
    if (!active().length) { c.checked = true; iOS.toast('Minimal satu jenis aktif'); return; }
    iOS.buzz(); gen();
  }));
  $('gen').onclick = () => { iOS.buzz(10); gen(); };
  $('cp').onclick = () => iOS.copy(pw, 'Password tersalin ✓');
  iOS.fillRange($('len')); gen();
})();
</script>
</body>
</html>
