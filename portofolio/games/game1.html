<meta charset="utf-8">
<body>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
            touch-action: none;
        }

        body {
            background:
                radial-gradient(circle at 18% 8%, rgba(255,107,157,0.16), transparent 55%),
                radial-gradient(circle at 85% 92%, rgba(122,162,255,0.16), transparent 55%),
                #14151c;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 10px 0;
        }

        #gb-case {
            width: 100%;
            max-width: 420px;
            background: linear-gradient(155deg, #2a2c38 0%, #1c1d26 55%, #17181f 100%);
            contain: content;
            border-radius: 26px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow:
                0 20px 50px -12px rgba(0,0,0,0.65),
                0 0 0 1px rgba(255,255,255,0.05) inset;
            transform: translateZ(0);
            position: relative;
        }

        /* playful doodle accents drawn purely in CSS */
        #gb-case::before {
            content: '';
            position: absolute;
            top: -30px;
            right: -30px;
            width: 130px;
            height: 130px;
            background: radial-gradient(circle, rgba(255,196,80,0.22), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }
        #gb-case::after {
            content: '';
            position: absolute;
            bottom: -40px;
            left: -40px;
            width: 160px;
            height: 160px;
            background: radial-gradient(circle, rgba(122,162,255,0.16), transparent 70%);
            pointer-events: none;
            z-index: 0;
        }

        #topbar {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 14px 16px 4px;
            position: relative;
            z-index: 1;
        }

        .doodle-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #ff6b9d;
        }
        .doodle-dot.b { background: #ffd166; }
        .doodle-dot.c { background: #6bd6a8; }

        #topbar .brand-text {
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #9aa0b4;
            margin: 0 6px;
        }

        #screen-wrap {
            width: 100%;
            background: transparent;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            padding: 6px 20px 18px;
            contain: paint layout;
            z-index: 1;
        }

        #screen-container {
            position: relative;
            width: 100%;
            max-width: 340px;
            aspect-ratio: 10 / 9;
            background: #9bd66a;
            border-radius: 16px;
            overflow: hidden;
            box-shadow:
                inset 0 0 0 6px #232634,
                inset 0 0 22px rgba(0,0,0,0.35),
                0 10px 24px -8px rgba(0,0,0,0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            contain: paint layout;
            will-change: transform;
            transform: translateZ(0);
        }

        #screen-container::before {
            content: '';
            position: absolute;
            top: 6px;
            left: 10px;
            font-size: 12px;
            color: rgba(255,255,255,0.55);
            z-index: 2;
            pointer-events: none;
        }
        #screen-container::after {
            content: '';
            position: absolute;
            bottom: 6px;
            right: 10px;
            font-size: 10px;
            color: rgba(255,255,255,0.35);
            z-index: 2;
            pointer-events: none;
        }

        canvas#screen {
            width: 100%;
            height: 100%;
            object-fit: fill;
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            will-change: contents;
            transform: translateZ(0);
        }

        #tap-hint {
            position: absolute;
            bottom: 26px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: rgba(255,255,255,0.55);
            background: rgba(0,0,0,0.35);
            padding: 5px 12px;
            border-radius: 20px;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 3;
            white-space: nowrap;
        }
        #tap-hint.hidden-hint {
            opacity: 0;
        }

        #controls {
            padding: 4px 20px 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            position: relative;
            z-index: 1;
        }

        #primary-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 4px;
        }

        #dpad-wrapper {
            position: relative;
            width: 138px;
            height: 138px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #dpad {
            position: relative;
            width: 130px;
            height: 130px;
            filter: drop-shadow(0 6px 8px rgba(0,0,0,0.4));
        }

        #dpad-center {
            position: absolute;
            left: 42px;
            top: 42px;
            width: 46px;
            height: 46px;
            background: linear-gradient(145deg, #3a3d4c, #24262f);
            border-radius: 9px;
            z-index: 1;
        }
        #dpad-center::after {
            content: '';
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 16px;
            height: 16px;
            background: radial-gradient(circle, #4a4d5e 0%, #1b1c24 100%);
            border-radius: 50%;
        }

        .dpad-btn {
            position: absolute;
            background: linear-gradient(145deg, #3a3d4c, #24262f);
            border: none;
            outline: none;
            cursor: pointer;
            z-index: 2;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: inset 0 1px 1px rgba(255,255,255,0.12);
        }

        .dpad-btn:active, .dpad-btn.touching {
            background: linear-gradient(145deg, #1b1c24, #101116) !important;
        }

        #btn-up {
            left: 42px;
            top: 0;
            width: 46px;
            height: 48px;
            border-radius: 10px 10px 0 0;
        }

        #btn-down {
            left: 42px;
            bottom: 0;
            width: 46px;
            height: 48px;
            border-radius: 0 0 10px 10px;
        }

        #btn-left {
            left: 0;
            top: 42px;
            width: 48px;
            height: 46px;
            border-radius: 10px 0 0 10px;
        }

        #btn-right {
            right: 0;
            top: 42px;
            width: 48px;
            height: 46px;
            border-radius: 0 10px 10px 0;
        }

        .arrow {
            width: 0;
            height: 0;
            opacity: 0.55;
        }

        #btn-up .arrow {
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-bottom: 7px solid #d7d9e4;
            margin-bottom: 10px;
        }

        #btn-down .arrow {
            border-left: 5px solid transparent;
            border-right: 5px solid transparent;
            border-top: 7px solid #d7d9e4;
            margin-top: 10px;
        }

        #btn-left .arrow {
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-right: 7px solid #d7d9e4;
            margin-right: 10px;
        }

        #btn-right .arrow {
            border-top: 5px solid transparent;
            border-bottom: 5px solid transparent;
            border-left: 7px solid #d7d9e4;
            margin-left: 10px;
        }

        #ab-wrapper {
            position: relative;
            width: 128px;
            height: 84px;
            transform: rotate(-22deg);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px;
        }

        .btn-action-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .btn-action {
            width: 58px;
            height: 58px;
            border-radius: 50%;
            border: none;
            outline: none;
            cursor: pointer;
            background: radial-gradient(circle at 32% 30%, #ff9fc0 0%, #ff5f96 55%, #d63e78 100%);
            box-shadow:
                0 6px 8px rgba(0,0,0,0.4),
                inset 0 1px 3px rgba(255,255,255,0.5),
                inset 0 -3px 4px rgba(0,0,0,0.15);
            transition: transform 0.05s, box-shadow 0.05s;
        }

        #btn-a {
            background: radial-gradient(circle at 32% 30%, #9fd0ff 0%, #5fa8ff 55%, #3e78d6 100%);
        }

        .btn-action:active, .btn-action.touching {
            transform: translateY(2px) scale(0.94);
            box-shadow: 0 2px 3px rgba(0,0,0,0.4), inset 0 1px 2px rgba(0,0,0,0.3);
        }
        #btn-b:active, #btn-b.touching { background: #b83d68; }
        #btn-a:active, #btn-a.touching { background: #3d76b8; }

        .btn-action-label {
            font-size: 12px;
            font-weight: 900;
            color: #d7d9e4;
            transform: rotate(22deg);
            font-family: "Arial", sans-serif;
        }

        #secondary-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 26px;
            margin-top: 2px;
            padding-bottom: 2px;
        }

        .system-btn-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .btn-system {
            width: 58px;
            height: 15px;
            background: linear-gradient(180deg, #4a4d5e 0%, #2a2c38 100%);
            border-radius: 8px;
            border: none;
            outline: none;
            cursor: pointer;
            box-shadow: 0 3px 4px rgba(0,0,0,0.35), inset 0 1px 1px rgba(255,255,255,0.15);
        }

        .btn-system:active, .btn-system.touching {
            transform: translateY(1px);
            background: #1b1c24;
            box-shadow: 0 1px 1px rgba(0,0,0,0.3);
        }

        .system-label {
            font-size: 8px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #6b7086;
            text-transform: uppercase;
            font-family: "Arial", sans-serif;
        }

        #watermark {
            text-align: center;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 0.5px;
            color: #4a4d5e;
            padding: 4px 0 14px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            position: relative;
            z-index: 1;
        }

    </style>

    <div id="gb-case">
        <div id="topbar">
            <span class="doodle-dot"></span>
            <span class="doodle-dot b"></span>
            <span class="doodle-dot c"></span>
            <span class="brand-text">GameBoy</span>
        </div>
        <div id="screen-wrap">
            <div id="screen-container">
                <canvas id="screen" width="160" height="144"></canvas>
                <span id="tap-hint">tekan untuk main</span>
            </div>
        </div>

        <div id="controls">
            <div id="primary-controls">
                <div id="dpad-wrapper">
                    <div id="dpad">
                        <button class="dpad-btn" id="btn-up" data-key="2"><div class="arrow"></div></button>
                        <button class="dpad-btn" id="btn-left" data-key="1"><div class="arrow"></div></button>
                        <div id="dpad-center"></div>
                        <button class="dpad-btn" id="btn-right" data-key="0"><div class="arrow"></div></button>
                        <button class="dpad-btn" id="btn-down" data-key="3"><div class="arrow"></div></button>
                    </div>
                </div>

                <div id="ab-wrapper">
                    <div class="btn-action-wrap">
                        <button class="btn-action" id="btn-b" data-key="5"></button>
                        <div class="btn-action-label">B</div>
                    </div>
                    <div class="btn-action-wrap">
                        <button class="btn-action" id="btn-a" data-key="4"></button>
                        <div class="btn-action-label">A</div>
                    </div>
                </div>
            </div>

            <div id="secondary-controls">
                <div class="system-btn-wrap">
                    <button class="btn-system" id="sel" data-key="6"></button>
                    <div class="system-label">SELECT</div>
                </div>
                <div class="system-btn-wrap">
                    <button class="btn-system" id="st" data-key="7"></button>
                    <div class="system-label">START</div>
                </div>
            </div>
        </div>

        <div id="watermark">MadeByNazx</div>
    </div>

  const canvas = document.getElementById('screen');
  const screenWrap = document.getElementById('screen-wrap');

  let gb = null;
  let romLoaded = false;

  // ---------------------------------------------------------------
  // AUDIO SYSTEM
  // ---------------------------------------------------------------
  // Central audio state. We never create more than one AudioContext:
  // XAudioServer (inside the emulator) owns the AudioContext instance
  // once created; we only ever resume() it, never re-instantiate it.
  const AudioSystem = {
    unlocked: false,      // true once we've successfully resumed/started audio at least once
    volume: 1,            // fixed master volume, applied via XAudioServer.changeVolume
    initedOnce: false,    // whether gb.initSound() has already been called

    // Called on every first user interaction (button press, tap, key press).
    // Safe to call many times; each call is cheap once unlocked.
    unlock() {
      if (!gb) return;

      // Make sure settings[0] (the "audio enabled" flag the emulator core
      // reads) is on. If it's already true nothing changes here.
      if (typeof settings !== 'undefined') {
        settings[0] = true;
      }

      // First-time: create the XAudioServer / AudioContext via the
      // emulator's own initSound(). This must only run once — GameBoyCore's
      // initSound() guards internally against creating a second
      // AudioContext (XAudioJSWebAudioLaunchedContext flag), but we also
      // guard here to avoid unnecessary allocations of the audio ring
      // buffers / resampler on every keypress.
      if (!this.initedOnce) {
        try {
          gb.initSound();
          this.initedOnce = true;
        } catch (e) {
          console.error('Audio init failed:', e);
        }
      }

      // The actual unlock: resume the underlying AudioContext if Chrome
      // (or any browser) created it suspended due to autoplay policy.
      // window.XAudioJSWebAudioContextHandle is set by XAudioServer's
      // initializeWebAudio() the first time it runs.
      try {
        const ctx = window.XAudioJSWebAudioContextHandle;
        if (ctx && ctx.state === 'suspended') {
          ctx.resume().then(() => {
            this.unlocked = true;
            this._syncVolume();
            this._hideHint();
          }).catch(() => {});
        } else if (ctx && ctx.state === 'running') {
          this.unlocked = true;
          this._hideHint();
        }
      } catch (e) {}

      this._syncVolume();
    },

    // Re-apply the current volume to the emulator's audio handle (always unmuted).
    _syncVolume() {
      if (!gb || !gb.audioHandle) return;
      try {
        gb.audioHandle.changeVolume(this.volume);
      } catch (e) {}
    },

    _hideHint() {
      const hint = document.getElementById('tap-hint');
      if (hint) hint.classList.add('hidden-hint');
    }
  };

  // Attach unlock() to every kind of "first interaction" the user might
  // perform to start the game — this covers PLAY / screen tap / any
  // controller button — per the requirement that we should not force an
  // extra dedicated "enable audio" tap.
  function bindGlobalUnlock() {
    const evts = ['touchstart', 'pointerdown', 'mousedown', 'keydown'];
    const handler = () => AudioSystem.unlock();
    evts.forEach(evt => {
      window.addEventListener(evt, handler, { passive: true });
    });
  }
  bindGlobalUnlock();

  // Canvas context perf hints (unrelated to audio, kept from original).
  const origGetContext = canvas.getContext.bind(canvas);
  canvas.getContext = function(t, opt) {
    return origGetContext(t, Object.assign({ alpha: false, desynchronized: true }, opt));
  };

  async function loadAndStartROM() {
    try {
      const binStr = atob(GZ_ROM_BASE64);
      const bytes = new Uint8Array(binStr.length);
      for (let i = 0; i < binStr.length; i++) bytes[i] = binStr.charCodeAt(i);

      const ds = new DecompressionStream('gzip');
      const writer = ds.writable.getWriter();
      writer.write(bytes);
      writer.close();

      const chunks = [];
      const reader = ds.readable.getReader();
      let totalLen = 0;
      while (true) {
        const { value, done } = await reader.read();
        if (done) break;
        chunks.push(value);
        totalLen += value.length;
      }

      const u8 = new Uint8Array(totalLen);
      let offset = 0;
      for (const ch of chunks) {
        u8.set(ch, offset);
        offset += ch.length;
      }

      let romBinary = '';
      const CHUNK = 8192;
      for (let i = 0; i < u8.length; i += CHUNK) {
        romBinary += String.fromCharCode.apply(null, u8.subarray(i, Math.min(i + CHUNK, u8.length)));
      }

      gb = new GameBoyCore(canvas, romBinary);
      gb.start();
      gb.stopEmulator &= 1;
      romLoaded = true;

      // If the page already received a user gesture before the ROM
      // finished decoding/booting (e.g. user tapped while it was loading),
      // make sure we still unlock immediately rather than waiting for
      // another gesture.
      if (pendingGestureBeforeLoad) {
        AudioSystem.unlock();
      }

      startLoop();
    } catch (err) {
      console.error('Failed to load ROM:', err);
    }
  }

  // Tracks whether a user gesture happened before the ROM/emulator was
  // ready, so we can unlock audio the instant it becomes ready instead of
  // silently missing that gesture.
  let pendingGestureBeforeLoad = false;
  window.addEventListener('pointerdown', () => { if (!gb) pendingGestureBeforeLoad = true; }, { passive: true, once: true });
  window.addEventListener('touchstart', () => { if (!gb) pendingGestureBeforeLoad = true; }, { passive: true, once: true });

  let lastTime = performance.now();
  let accumulator = 0;

  function runFrame() {
    if (!gb) return;
    const now = performance.now();
    let dt = now - lastTime;
    if (dt < 0) dt = 16.67;
    if (dt > 100) dt = 100;
    lastTime = now;
    accumulator += dt;

    let frames = 0;
    while (accumulator >= 8 && frames < 4) {
      if (gb && !document.hidden) {
        gb.run();
      }
      accumulator -= 8;
      frames++;
    }
    if (accumulator >= 8) accumulator = 0;
  }

  function animLoop() {
    requestAnimationFrame(animLoop);
    runFrame();
  }

  function startLoop() {
    requestAnimationFrame(animLoop);
    setInterval(runFrame, 16);
  }

  loadAndStartROM();

  // Audio is always on (no mute/volume UI) — unlocked on first interaction below.

  // JoyPad Input Mapping
  function handleInput(keyIndex, isDown) {
    if (!gb) return;
    gb.JoyPadEvent(keyIndex, isDown);
  }

  const btnMap = {
    'btn-right': 0,
    'btn-left': 1,
    'btn-up': 2,
    'btn-down': 3,
    'btn-a': 4,
    'btn-b': 5,
    'sel': 6,
    'st': 7
  };

  let gameStarted = false;
  let pulseTimer = null;

  function pulseStart() {
    AudioSystem.unlock();
    handleInput(7, true);
    const stEl = document.getElementById('st');
    if (stEl) stEl.classList.add('touching');
    clearTimeout(pulseTimer);
    pulseTimer = setTimeout(() => {
      handleInput(7, false);
      if (stEl) stEl.classList.remove('touching');
    }, 200);
  }

  function isTitleScreen() {
    return !gameStarted;
  }

  function bindBtn(id, keyCode) {
    const el = document.getElementById(id);
    if (!el) return;

    let isDown = false;

    const onDown = (e) => {
      if (e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
      }
      if (isDown) return;
      isDown = true;
      AudioSystem.unlock();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch(_) {}
      el.classList.add('touching');

      if (isTitleScreen()) {
        if (keyCode === 4 || keyCode === 5 || keyCode === 6 || keyCode === 7) {
          pulseStart();
          gameStarted = true;
        }
      }

      handleInput(keyCode, true);
    };

    const onUp = (e) => {
      if (e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
      }
      if (!isDown) return;
      isDown = false;
      el.classList.remove('touching');
      handleInput(keyCode, false);
    };

    el.addEventListener('touchstart', onDown, { passive: false });
    el.addEventListener('touchend', onUp, { passive: false });
    el.addEventListener('touchcancel', onUp, { passive: false });

    el.addEventListener('pointerdown', onDown);
    el.addEventListener('pointerup', onUp);
    el.addEventListener('pointercancel', onUp);

    el.addEventListener('mousedown', onDown);
    el.addEventListener('mouseup', onUp);
  }

  for (const [id, code] of Object.entries(btnMap)) {
    bindBtn(id, code);
  }

  if (screenWrap) {
    const tapScreen = (e) => {
      // Ignore taps that originated on the audio controls, so the
      // volume slider / mute button remain independently interactive.
      if (e && e.target && e.target.closest && e.target.closest('#audio-controls')) {
        return;
      }
      if (e) {
        if (e.cancelable) e.preventDefault();
        e.stopPropagation();
      }
      AudioSystem.unlock();
      if (navigator.vibrate) try { navigator.vibrate(15); } catch(_) {}
      pulseStart();
      gameStarted = true;
    };
    screenWrap.addEventListener('touchstart', tapScreen, { passive: false });
    screenWrap.addEventListener('pointerdown', tapScreen);
    screenWrap.addEventListener('mousedown', tapScreen);
  }

  // D-Pad thumb slide tracking
  const dpadEl = document.getElementById('dpad');
  if (dpadEl) {
    let activeDpadKey = null;

    const getDpadKeyFromPoint = (clientX, clientY) => {
      const el = document.elementFromPoint(clientX, clientY);
      if (!el) return null;
      const btn = el.closest('#dpad button');
      if (btn && btnMap.hasOwnProperty(btn.id)) {
        return btnMap[btn.id];
      }
      return null;
    };

    dpadEl.addEventListener('touchmove', (e) => {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      if (!e.touches || e.touches.length === 0) return;
      const touch = e.touches[0];
      const newKey = getDpadKeyFromPoint(touch.clientX, touch.clientY);

      if (newKey !== activeDpadKey) {
        if (activeDpadKey !== null) {
          handleInput(activeDpadKey, false);
          const prevId = Object.keys(btnMap).find(k => btnMap[k] === activeDpadKey);
          if (prevId) document.getElementById(prevId)?.classList.remove('touching');
        }
        activeDpadKey = newKey;
        if (activeDpadKey !== null) {
          AudioSystem.unlock();
          handleInput(activeDpadKey, true);
          const currId = Object.keys(btnMap).find(k => btnMap[k] === activeDpadKey);
          if (currId) document.getElementById(currId)?.classList.add('touching');
        }
      }
    }, { passive: false });

    const endDpadSlide = (e) => {
      if (e.cancelable) e.preventDefault();
      e.stopPropagation();
      if (activeDpadKey !== null) {
        handleInput(activeDpadKey, false);
        const prevId = Object.keys(btnMap).find(k => btnMap[k] === activeDpadKey);
        if (prevId) document.getElementById(prevId)?.classList.remove('touching');
        activeDpadKey = null;
      }
    };

    dpadEl.addEventListener('touchend', endDpadSlide, { passive: false });
    dpadEl.addEventListener('touchcancel', endDpadSlide, { passive: false });
  }

  const keyMap = {
    'ArrowRight': 0, 'KeyD': 0,
    'ArrowLeft': 1, 'KeyA': 1,
    'ArrowUp': 2, 'KeyW': 2,
    'ArrowDown': 3, 'KeyS': 3,
    'KeyX': 4, 'KeyK': 4,
    'KeyZ': 5, 'KeyJ': 5,
    'ShiftLeft': 6, 'ShiftRight': 6,
    'Enter': 7
  };

  window.addEventListener('keydown', (e) => {
    if (keyMap.hasOwnProperty(e.code)) {
      AudioSystem.unlock();
      handleInput(keyMap[e.code], true);
      const el = document.querySelector(`[data-key="${keyMap[e.code]}"]`);
      if (el) el.classList.add('touching');
      if (isTitleScreen() && (keyMap[e.code] === 4 || keyMap[e.code] === 5 || keyMap[e.code] === 7)) {
        pulseStart();
        gameStarted = true;
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    if (keyMap.hasOwnProperty(e.code)) {
      handleInput(keyMap[e.code], false);
      const el = document.querySelector(`[data-key="${keyMap[e.code]}"]`);
      if (el) el.classList.remove('touching');
    }
  });

})();

</script>
</body>
